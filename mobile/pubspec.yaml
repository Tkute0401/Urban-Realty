name: urban_realty_mobile
description: Flutter mobile client for Urban Realty APIs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  provider: ^6.1.1
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  connectivity_plus: ^5.0.2
  firebase_messaging: ^14.7.10
  firebase_core: ^2.24.2
  webview_flutter: ^4.4.2
  razorpay_flutter: ^1.3.5
  flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

