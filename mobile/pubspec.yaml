name: urban_realty_mobile
description: Flutter mobile client for Urban Realty APIs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # HTTP & API
  dio: ^5.9.0
  connectivity_plus: ^5.0.2
  
  # Storage & Caching
  shared_preferences: ^2.5.3
  
  # UI & Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Navigation & Routing
  go_router: ^14.2.7
  
  # Utils
  equatable: ^2.0.7
  intl: ^0.17.0
  uuid: ^4.5.1
  
  # Animation
  flutter_animate: ^4.5.0
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  location: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
