name: Urban Realty Mobile E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        device: [pixel-8a, pixel-9-pro-xl]
        test-type: [app, discovery, auth, performance]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.2'
        channel: 'stable'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Setup Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: ${{ matrix.device }}
        script: echo "Emulator started"
        
    - name: Get Flutter dependencies
      run: |
        cd mobile
        flutter pub get
        
    - name: Run Flutter tests
      run: |
        cd mobile
        flutter test integration_test/app_test.dart
        flutter test integration_test/property_discovery_test.dart
        flutter test integration_test/user_authentication_test.dart
        flutter test integration_test/performance_test.dart
        
    - name: Generate test report
      if: always()
      run: |
        cd mobile
        mkdir -p test_reports
        echo "# Test Report" > test_reports/test_report.md
        echo "Device: ${{ matrix.device }}" >> test_reports/test_report.md
        echo "Test Type: ${{ matrix.test-type }}" >> test_reports/test_report.md
        echo "Date: $(date)" >> test_reports/test_report.md
        
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.device }}-${{ matrix.test-type }}
        path: mobile/test_reports/
        
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ matrix.device }}-${{ matrix.test-type }}
        path: mobile/screenshots/

  performance-tests:
    runs-on: ubuntu-latest
    needs: e2e-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.2'
        channel: 'stable'
        
    - name: Run performance tests
      run: |
        cd mobile
        flutter test integration_test/performance_test.dart --reporter=json > performance_results.json
        
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: mobile/performance_results.json

  security-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.2'
        channel: 'stable'
        
    - name: Run security analysis
      run: |
        cd mobile
        flutter analyze --fatal-infos
        
    - name: Check for security vulnerabilities
      run: |
        cd mobile
        flutter pub deps --json | jq '.packages[] | select(.vulnerabilities != null)'

  notify-results:
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests, security-tests]
    if: always()
    
    steps:
    - name: Notify test results
      run: |
        echo "E2E Tests: ${{ needs.e2e-tests.result }}"
        echo "Performance Tests: ${{ needs.performance-tests.result }}"
        echo "Security Tests: ${{ needs.security-tests.result }}"
        
    - name: Send notification
      if: failure()
      run: |
        echo "Tests failed! Check the logs for details."


