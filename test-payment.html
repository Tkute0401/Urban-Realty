<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Razorpay Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
    <h1>Test Razorpay Integration</h1>
    <button onclick="testPayment()">Test Payment (Basic Plan - ₹29)</button>

    <script>
        async function testPayment() {
            try {
                // Test with the Razorpay key from .env
                const options = {
                    key: 'rzp_test_9WGMd6HNLRdlPz', // Test key from .env
                    amount: 2900, // ₹29 in paise
                    currency: 'INR',
                    name: 'Urban Realty',
                    description: 'Basic Plan Subscription',
                    order_id: 'test_order_' + Date.now(),
                    handler: function(response) {
                        console.log('Payment successful:', response);
                        alert('Payment ID: ' + response.razorpay_payment_id);
                    },
                    prefill: {
                        name: 'Test User',
                        email: 'test@example.com',
                        contact: '9999999999'
                    },
                    theme: {
                        color: '#3399cc'
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();
            } catch (error) {
                console.error('Payment error:', error);
                alert('Payment failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
