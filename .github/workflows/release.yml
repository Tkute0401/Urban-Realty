# Release workflow for Urban Realty

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '18'
  FLUTTER_VERSION: '3.16.0'

jobs:
  # Create release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  # Build and upload client
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm run install-all

      - name: Build client
        run: cd client && npm run build
        env:
          VITE_API_BASE_URL: https://urban-realty-production.up.railway.app/api/v1

      - name: Upload client build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./client/dist
          asset_name: client-build.zip
          asset_content_type: application/zip

  # Build and upload Flutter APK
  build-flutter:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Build APK
        run: cd mobile && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./mobile/build/app/outputs/flutter-apk/app-release.apk
          asset_name: urban-realty-android.apk
          asset_content_type: application/vnd.android.package-archive

  # Build and upload Flutter iOS
  build-flutter-ios:
    name: Build Flutter iOS
    runs-on: macos-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Build iOS
        run: cd mobile && flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./mobile/build/ios/iphoneos/Runner.app
          asset_name: urban-realty-ios.zip
          asset_content_type: application/zip

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [create-release, build-client]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railway-app/railway-deploy@v1
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          service: urban-realty-production
          detach: true

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://urban-realty-production.up.railway.app/api/v1/health || exit 1

  # Notify release
  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [deploy-production, build-flutter, build-flutter-ios]
    if: always()
    steps:
      - name: Notify release success
        if: success()
        run: |
          echo "🎉 Release ${{ github.ref }} deployed successfully!"
          # Add Slack/Discord notification here

      - name: Notify release failure
        if: failure()
        run: |
          echo "❌ Release ${{ github.ref }} failed!"
          # Add Slack/Discord notification here