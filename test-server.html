<!DOCTYPE html>
<html>
<head>
    <title>Mappls Test Server</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .loading { background: #e3f2fd; color: #1976d2; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        #map { height: 400px; width: 100%; border: 1px solid #ccc; margin: 10px 0; }
        .debug { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Mappls API Test (HTTP Server)</h1>
    <div id="status" class="status loading">Loading Mappls...</div>
    <div id="map"></div>
    <div id="debug" class="debug"></div>
    
    <script>
        const apiKey = '82f5c384638d8cfc7d13e310780bae89';
        const debugDiv = document.getElementById('debug');
        const statusDiv = document.getElementById('status');
        
        function log(message) {
            console.log(message);
            debugDiv.innerHTML += message + '<br>';
        }
        
        function updateStatus(message, type) {
            statusDiv.innerHTML = message;
            statusDiv.className = 'status ' + type;
        }
        
        log('🔧 Starting Mappls API test (HTTP Server)...');
        log('🔧 API Key: ' + apiKey.substring(0, 10) + '...');
        log('🔧 User Agent: ' + navigator.userAgent);
        log('🔧 Current URL: ' + window.location.href);
        log('🔧 Protocol: ' + window.location.protocol);
        
        // Test API key validity first
        testApiKey();
        
        function testApiKey() {
            log('🔧 Testing API key validity...');
            
            // Test with a simple API endpoint
            fetch(`https://apis.mappls.com/advancedmaps/api/${apiKey}/map_sdk?v=3.0&layer=vector`, {
                method: 'HEAD',
                mode: 'no-cors'
            })
            .then(() => {
                log('✅ API key test completed (no-cors mode)');
            })
            .catch((error) => {
                log('⚠️ API key test failed: ' + error.message);
            });
        }
        
        // Test different Mappls script URLs - using the correct format
        const scriptUrls = [
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/map_sdk?v=3.0&layer=vector`,
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/js/map_v1.4.2.js`,
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/map_sdk?layer=vector`,
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/js/map_v1.4.1.js`,
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/js/map_v1.4.0.js`,
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/map_sdk?v=2.0&layer=vector`,
            // Additional fallback URLs
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/js/map_v1.3.9.js`,
            `https://apis.mappls.com/advancedmaps/api/${apiKey}/js/map_v1.3.8.js`
        ];
        
        let currentUrlIndex = 0;
        
        function tryNextUrl() {
            if (currentUrlIndex >= scriptUrls.length) {
                updateStatus('❌ All Mappls script URLs failed to load', 'error');
                log('❌ All script URLs exhausted');
                return;
            }
            
            const scriptUrl = scriptUrls[currentUrlIndex];
            log(`🔧 Trying URL ${currentUrlIndex + 1}: ${scriptUrl}`);
            
            const script = document.createElement('script');
            script.src = scriptUrl;
            script.async = true;
            
            script.onload = function() {
                log('✅ Script loaded successfully from: ' + scriptUrl);
                updateStatus('✅ Mappls script loaded!', 'success');
                
                // Wait a bit for the script to initialize
                setTimeout(() => {
                    if (window.mappls) {
                        log('✅ window.mappls is available');
                        log('✅ Mappls version: ' + (window.mappls.version || 'unknown'));
                        
                        try {
                            const map = new window.mappls.Map('map', {
                                center: { lat: 28.6139, lng: 77.2090 },
                                zoom: 10
                            });
                            log('✅ Map created successfully');
                            updateStatus('✅ Map loaded and displayed successfully!', 'success');
                        } catch (error) {
                            log('❌ Error creating map: ' + error.message);
                            updateStatus('❌ Error creating map: ' + error.message, 'error');
                        }
                    } else {
                        log('❌ window.mappls is not available after script load');
                        updateStatus('❌ window.mappls not available', 'error');
                    }
                }, 1000);
            };
            
            script.onerror = function(error) {
                log('❌ Failed to load script from: ' + scriptUrl);
                log('❌ Error details: ' + (error.message || 'Unknown error'));
                currentUrlIndex++;
                tryNextUrl();
            };
            
            document.head.appendChild(script);
        }
        
        // Start trying URLs
        tryNextUrl();
    </script>
</body>
</html>
