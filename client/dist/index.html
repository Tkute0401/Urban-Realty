  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div class="splash-content">
        <div class="logo-container">
          <img src="/vite.png" alt="UrbanRealty360" class="logo" />
        </div>
        <div class="shuffle-text-container">
          <h1 class="shuffle-text">URBAN REALTY <span class="highlight">360</span></h1>
        </div>
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress"></div>
          </div>
        </div>
        <p class="tagline">Redefining real estate experiences</p>
      </div>
      <div class="background-pattern"></div>
    </div>

    <div id="root"></div>

    <script>
      // Text shuffle animation
      class TextShuffle {
        constructor(element) {
          this.element = element;
          this.text = element.innerText;
          this.chars = "01_#%&/()=?*+~-";
          this.animate();
        }
        
        animate() {
          let iterations = 0;
          const interval = setInterval(() => {
            this.element.innerText = this.text
              .split("")
              .map((letter, index) => {
                if(index < iterations) {
                  return this.text[index];
                }
                return this.chars[Math.floor(Math.random() * this.chars.length)];
              })
              .join("");
            
            if(iterations >= this.text.length) clearInterval(interval);
            iterations += 1 / 3;
          }, 30);
        }
      }
      
      // Percentage counter animation
      function animateProgress() {
        let counter = 0;
        const progressBar = document.querySelector('.progress');
        const interval = setInterval(() => {
          counter += Math.floor(Math.random() * 5) + 1;
          if (counter >= 100) {
            counter = 100;
            clearInterval(interval);
          }
          progressBar.style.width = counter + '%';
        }, 30);
      }

      window.addEventListener('load', function() {
        // Start animations
        const shuffleText = new TextShuffle(document.querySelector('.shuffle-text'));
        animateProgress();
        
        // Remove splash screen
        setTimeout(function() {
          const splash = document.getElementById('splash-screen');
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 500);
        }, 2500);
      });
    </script>
  </body>
